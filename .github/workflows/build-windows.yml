# Tự build bộ cài Windows (.exe) mỗi khi đẩy code lên GitHub, hoặc bấm "Run workflow" trong tab Actions.
name: Build bộ cài Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện
        run: npm install

      - name: Chạy kiểm tra phần lõi
        run: npm test

      - name: Đóng gói bộ cài
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Tải bộ cài lên (tab Actions > lần chạy này > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: H2-Video-Studio-Setup
          path: dist/*.exe
          retention-days: 30

      - name: Đăng bản phát hành khi gắn tag v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
